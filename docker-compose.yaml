services:
  mysql:
    image: mysql:8.4.10
    container_name: collabdesk-mysql
    restart: always

    environment:
      MYSQL_DATABASE: collabdesk
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD is required}
    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: mysqladmin ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data: